<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Foodcker</title>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foodcker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css?v=17">
</head>
<body>
<section class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><img src="icons/icon-192.png" alt="" width="56" height="56"><h1>Foodcker</h1></div>
    <nav class="vtabs auth-tabs" role="tablist" aria-label="Konto">
      <button class="vtab" role="tab" data-auth="in" aria-selected="true">Zaloguj się</button>
      <button class="vtab" role="tab" data-auth="up" aria-selected="false">Załóż konto</button>
    </nav>
    <form id="auth-form" class="lform" novalidate>
      <div class="field"><label for="a-email">E-mail</label><input id="a-email" name="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="a-pass">Hasło</label><input id="a-pass" name="password" type="password" required minlength="6" autocomplete="current-password"></div>
      <div class="field" id="a-pass2-row" hidden><label for="a-pass2">Powtórz hasło</label><input id="a-pass2" name="password2" type="password" minlength="6" autocomplete="new-password"></div>
      <p class="auth-err" id="auth-err" role="alert" hidden></p>
      <button class="primary" type="submit" id="a-submit">Zaloguj się</button>
    </form>
  </div>
</section>

<main class="wrap" id="app-main">
  <header class="top">
    <div class="top-l" id="top-l"></div>
    <div class="actions">
      <div class="weeknav">
        <button id="go-today">Dziś</button>
      </div>
      <button class="add" id="add-meal"><span class="plus" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span>Dodaj posiłek</button>
      <button class="icon" id="menu-btn" aria-label="Menu"><svg class="ic-dots" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.6" fill="currentColor"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><circle cx="13" cy="8" r="1.6" fill="currentColor"/></svg><svg class="ic-burger" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <nav class="vtabs" role="tablist" aria-label="Widok">
    <button class="vtab" role="tab" data-view="day" aria-selected="true">Dzień</button>
    <button class="vtab" role="tab" data-view="history" aria-selected="false">Historia</button>
    <button class="vtab" role="tab" data-view="summary" aria-selected="false">Podsumowanie</button>
  </nav>

  <section id="view-day"></section>
  <section id="view-history" hidden></section>
  <section id="view-summary" hidden></section>
</main>

<div id="overlay"></div>
<script src="js/cloud.js?v=17"></script>
<script src="js/app.js?v=17"></script>
</body>
</html>
